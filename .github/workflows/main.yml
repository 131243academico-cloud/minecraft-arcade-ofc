name: Compilar Minecraft Arcade para Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Nuitka
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard

      - name: Compilar programa
      - name: Verificar arquivo Python
        run: |
          python -m nuitka --onefile --windows-console-mode=disable --enable-plugin=tk-inter --assume-yes-for-downloads --output-filename="Minecraft Arcade Demo Offline.exe" main.py
          dir
          python -m py_compile modo_demo.py

      - name: Enviar EXE para download
      - name: Compilar programa para Windows
        run: |
          python -m nuitka --onefile --windows-console-mode=disable --enable-plugin=tk-inter --assume-yes-for-downloads --output-dir=dist --output-filename="Minecraft Arcade Demo Offline.exe" modo_demo.py

      - name: Verificar executável
        run: |
          dir dist

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Arcade-Demo-Windows
          path: Minecraft Arcade Demo Offline.exe

          path: dist/Minecraft Arcade Demo Offline.exe
          if-no-files-found: error
