name: Compilar Jogo da Velha para Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4.2.2

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Nuitka e Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard pytoml rcom

      - name: Verificar arquivo Python
        run: |
          python -m py_compile main.py

      - name: Compilar programa para Windows
        run: |
          python -m nuitka --onefile --windows-console-mode=disable --enable-plugin=tk-inter --assume-yes-for-downloads --output-dir=dist --output-filename="Programa do jogo da velha sem joy.exe" main.py

      - name: Verificar executável
        run: |
          dir dist

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: Jogo-da-Velha-Windows
          path: dist/Programa do jogo da velha sem joy.exe
          if-no-files-found: error
