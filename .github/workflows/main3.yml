name: Compilar Jogo da Velha para Linux (AppImage)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4.2.2

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ferramentas do Sistema (AppImageTool)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2 wget
          # Baixa o appimagetool oficial corrigindo o redirecionamento com -L
          sudo wget -L -O /usr/local/bin/appimagetool https://github.com
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Instalar Nuitka e Dependências do Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard pytoml mcrcon

      - name: Verificar arquivo Python
        run: |
          python -m py_compile main.py

      - name: Compilar com o Nuitka
        run: |
          python -m nuitka --onefile --enable-plugin=tk-inter --assume-yes-for-downloads --output-dir=build_nuitka --output-filename=jogo-da-velha-rcon main.py

      - name: Estruturar Pasta AppDir
        run: |
          # Cria a árvore de diretórios padrão do Linux para o AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copia o binário compilado pelo Nuitka
          cp build_nuitka/jogo-da-velha-rcon AppDir/usr/bin/jogo-da-velha-rcon
          
          # Cria o arquivo de inicialização obrigatório (AppRun)
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          EXEC="${HERE}/usr/bin/jogo-da-velha-rcon"
          exec "${EXEC}" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Cria o atalho do sistema operacional obrigatório (.desktop)
          cat << EOF > AppDir/jogo-da-velha-rcon.desktop
          [Desktop Entry]
          Type=Application
          Name=Jogo da Velha RCON
          Exec=jogo-da-velha-rcon
          Icon=jogo-da-velha-rcon
          Categories=Game;
          Terminal=true
          EOF
          
          # Cria um ícone de placeholder transparente/vazio (necessário para compilar)
          touch AppDir/jogo-da-velha-rcon.png

      - name: Gerar Aplicativo AppImage Portátil
        run: |
          # Junta tudo em um único executável portátil de Linux com o nome final correto
          ARCH=x86_64 /usr/local/bin/appimagetool AppDir Programa_do_jogo_da_velha_sem_joy-x86_64.AppImage

      - name: Disponibilizar AppImage para Download
        uses: actions/upload-artifact@v4
        with:
          name: Jogo-da-Velha-Linux-AppImage
          path: Programa_do_jogo_da_velha_sem_joy-x86_64.AppImage
          if-no-files-found: error
